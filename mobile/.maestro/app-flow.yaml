# End-to-end journey through the app in the iOS simulator (Expo Go).
# Prereqs: `make run` (API + Expo) and a booted simulator, then: maestro test mobile/.maestro/app-flow.yaml
appId: host.exp.Exponent
---
- openLink: exp://127.0.0.1:8081
- extendedWaitUntil:
    visible:
      id: 'tab-home'
    timeout: 45000
- tapOn:
    id: 'tab-home'
- extendedWaitUntil:
    visible: 'New Quote'
    timeout: 15000

# Home: fetch a fresh quote (the current one may already be liked), then like it
- tapOn: 'New Quote'
- extendedWaitUntil:
    visible: 'Like'
    timeout: 10000
- tapOn: 'Like'
- extendedWaitUntil:
    visible: 'Liked'
    timeout: 10000

# Favorites: the liked quote is listed
- tapOn:
    id: 'tab-favorites'
- extendedWaitUntil:
    visible: 'saved .*'
    timeout: 10000

# Search: results come back and can be liked
- tapOn:
    id: 'tab-search'
- tapOn: 'Search quotes'
- inputText: 'coffee'
- pressKey: enter
- extendedWaitUntil:
    visible: 'Like'
    timeout: 15000
